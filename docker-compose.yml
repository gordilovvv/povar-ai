services:
  api:
    image: sema-ai:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT}:${PORT}"
    env_file: .env
    command: ["node", "dist/Webhook.js"]

  worker:
    image: sema-ai:${VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    command: ["node", "dist/Worker.js"]
